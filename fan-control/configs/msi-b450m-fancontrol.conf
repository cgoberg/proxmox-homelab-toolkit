# Forge fan curve - silence-first. Tuned 2026-08-30 from measured PWM->RPM sweep.
#
# All four populated channels are managed. An earlier revision of this file
# dropped pwm3/4/5 on the mistaken reading that 0 RPM meant "no fan fitted".
# It does not - they were simply below their start threshold. Dropping them
# handed those headers back to BIOS auto (enable=5), which spun them up to
# 1127/979/2227 RPM and made this host LOUDER. They belong under control.
#
# Measured stall points: fan2 never stalls (723 RPM at pwm 25); fan3 and fan4
# stop below pwm 45; fan5 stops below pwm 70. fan5 is the high-output channel
# (2947 RPM at full) and is almost certainly the CPU cooler.
#
# fan3/4/5 use MINPWM=0 so they stay fully stopped while the machine is cool,
# and fancontrol starts them via MINSTART once Tdie passes MINTEMP. fan2 keeps
# a small permanent floor for baseline case airflow.
#
# The previous MAXPWM=165 capped every channel at 65% duty, limiting cooling
# under sustained load for no idle-noise benefit. Removed.
# temp2_input on k10temp is Tdie (Tctl carries a +20C offset on this part).
INTERVAL=10
DEVPATH=hwmon1=devices/platform/nct6775.2592 hwmon2=devices/pci0000:00/0000:00:18.3
DEVNAME=hwmon1=nct6797 hwmon2=k10temp
FCTEMPS=hwmon1/pwm2=hwmon2/temp2_input hwmon1/pwm3=hwmon2/temp2_input hwmon1/pwm4=hwmon2/temp2_input hwmon1/pwm5=hwmon2/temp2_input
FCFANS=hwmon1/pwm2=hwmon1/fan2_input hwmon1/pwm3=hwmon1/fan3_input hwmon1/pwm4=hwmon1/fan4_input hwmon1/pwm5=hwmon1/fan5_input
MINTEMP=hwmon1/pwm2=50 hwmon1/pwm3=50 hwmon1/pwm4=50 hwmon1/pwm5=50
MAXTEMP=hwmon1/pwm2=75 hwmon1/pwm3=75 hwmon1/pwm4=75 hwmon1/pwm5=75
MINSTART=hwmon1/pwm2=60 hwmon1/pwm3=90 hwmon1/pwm4=90 hwmon1/pwm5=110
MINSTOP=hwmon1/pwm2=25 hwmon1/pwm3=55 hwmon1/pwm4=55 hwmon1/pwm5=70
MINPWM=hwmon1/pwm2=25 hwmon1/pwm3=0 hwmon1/pwm4=0 hwmon1/pwm5=0
MAXPWM=hwmon1/pwm2=255 hwmon1/pwm3=255 hwmon1/pwm4=255 hwmon1/pwm5=255
