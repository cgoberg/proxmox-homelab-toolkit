# Forge fan curve - silence-first. Tuned 2026-08-30 from measured PWM->RPM sweep.
#
# Ryzen 2700X idles at Tdie ~52C. The previous config used MINTEMP=25, which put
# the fans two-thirds up the ramp at idle (measured pwm1=202 -> 1898 RPM).
# MINTEMP must sit ABOVE idle temp or the fans never reach their floor.
#
# Tdie on this part spikes briefly above 55C at idle. With MINTEMP=55 that
# caught ~22% of polls and surged the fans to ~1800 RPM before falling back,
# which is more audible than steady noise. Band moved to 65-80 so only genuine
# sustained load ramps; full-load peak was measured at 74C against a 95C limit.
# Measured stall points: fan1 stops below pwm 85 (so its floor is 90);
# fan2/fan5 still spin at pwm 25 (floor 40 ~= 770 RPM).
# fancontrol requires MINSTOP >= MINPWM, so floors are set equal.
# temp2_input on k10temp is Tdie (Tctl carries a +10C offset on this part).
INTERVAL=10
DEVPATH=hwmon1=devices/platform/nct6775.2592 hwmon2=devices/pci0000:00/0000:00:18.3
DEVNAME=hwmon1=nct6795 hwmon2=k10temp
FCTEMPS=hwmon1/pwm1=hwmon2/temp2_input hwmon1/pwm2=hwmon2/temp2_input hwmon1/pwm5=hwmon2/temp2_input
FCFANS=hwmon1/pwm1=hwmon1/fan1_input hwmon1/pwm2=hwmon1/fan2_input hwmon1/pwm5=hwmon1/fan5_input
MINTEMP=hwmon1/pwm1=65 hwmon1/pwm2=65 hwmon1/pwm5=65
MAXTEMP=hwmon1/pwm1=80 hwmon1/pwm2=80 hwmon1/pwm5=80
MINSTART=hwmon1/pwm1=140 hwmon1/pwm2=60 hwmon1/pwm5=60
MINSTOP=hwmon1/pwm1=90 hwmon1/pwm2=40 hwmon1/pwm5=40
MINPWM=hwmon1/pwm1=90 hwmon1/pwm2=40 hwmon1/pwm5=40
MAXPWM=hwmon1/pwm1=255 hwmon1/pwm2=255 hwmon1/pwm5=255
