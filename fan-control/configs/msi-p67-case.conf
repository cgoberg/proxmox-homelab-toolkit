# Profile B - MSI P67A-GD55, i7-2600K, f71889a Super I/O
#
# fancontrol is NOT used on this host. Its generated config paired the nouveau
# GPU fan with the CPU temperature sensor, while the real case fans on the
# f71889a went unmanaged with pwm1 pinned at raw 255 (100% duty, 1718 RPM).
# The f71882fg driver publishes its attributes on the platform device rather
# than under hwmon/hwmonN/, which fancontrol cannot address at all.
#
# Measured sweep: fan1 has a hardware floor near 585 RPM and cannot stall, so
# its minimum is safe at pwm 70. fan2 DOES stall below pwm 55, so its floor is
# set to 80 for margin (~470 RPM).
TEMP_FILE=@coretemp/temp1_input
PWM_SPECS="/sys/devices/platform/f71882fg.656/pwm1:70:255 /sys/devices/platform/f71882fg.656/pwm2:80:255"
MINTEMP=50
MAXTEMP=75
INTERVAL=10
SAFE_PWM=255
INIT_CMD="echo 1 > /sys/devices/platform/f71882fg.656/pwm1_enable; echo 1 > /sys/devices/platform/f71882fg.656/pwm2_enable"
