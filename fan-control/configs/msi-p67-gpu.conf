# Profile B GPU fan - GeForce GTX 560 Ti (nouveau), not passed through to any guest.
#
# nouveau automatic mode parks this fan at 1890 RPM regardless of load, which
# made it the loudest component in the chassis once the case fans came down.
# Measured floor is ~1590 RPM at any pwm <= 40 (VBIOS enforced; it will not go
# lower and cannot be stopped), with GPU temp flat at 46-47C throughout.
#
# Driven from GPU temp, not CPU temp - the previous fancontrol config had this
# fan paired to the CPU sensor, which is what made it behave erratically.
TEMP_FILE=@nouveau/temp1_input
PWM_SPECS="@nouveau/pwm1:0:255"
MINTEMP=55
MAXTEMP=85
INTERVAL=15
SAFE_PWM=255
