# Profile A - Dell OptiPlex 7010, i7-3770S
#
# Load-tested 2026-08-30: a full all-core load peaked at 90C against a 93C
# limit with the original 70-88 band, because the ramp began too late and Dell
# steps coarsely. Narrowed to 68-80 so full speed is reached sooner. Idle is
# 60-64C, so the floor is still held when the machine is doing nothing.
#
# fancontrol CANNOT be used here: dell_smm exposes pwm as write-only (reads
# return -ENODATA) and fancontrol requires readable pwm. Writes do take effect.
#
# Dell SMM quantises pwm into a few discrete speeds rather than a smooth ramp.
# Measured: pwm<=55 -> ~1088/1123 RPM, pwm 70-120 -> ~1797/1505, pwm 170+ -> ~3000.
# BIOS default before any of this was 2312/1990 RPM at idle.
#
# IMPORTANT: a written pwm PERSISTS across module unload - the BIOS does not
# resume automatic control. So this cannot fail safe by simply stopping. The
# daemon drives fans to SAFE_PWM on exit, systemd restarts it on failure, and
# the floor was load-tested to stay in spec even if it were stuck there.
# Dell also enforces a hardware minimum: fans do not stop even at pwm 0.
TEMP_FILE=@coretemp/temp1_input
PWM_SPECS="@dell_smm/pwm1:0:255 @dell_smm/pwm2:0:255"
MINTEMP=68
MAXTEMP=80
INTERVAL=5
SAFE_PWM=255
